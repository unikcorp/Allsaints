# /etc/nginx/sites-available/allsaints  (replace the domain if different)
# Frontend (Next.js :3000) and backend API (Express :5000) behind ONE subdomain.
server {
    listen 80;
    server_name allsaints.unikcorp.org;

    client_max_body_size 25M;

    # --- Next.js's own API routes (must be listed BEFORE the generic /api/) ---
    location ^~ /api/pta-image            { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location ^~ /api/setup-pta-image      { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location ^~ /api/submit-live-admission  { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location ^~ /api/inspect-live-admission { return 404; }

    # --- Express backend ---
    location /api/     { proxy_pass http://127.0.0.1:5000; include /etc/nginx/proxy_params; }
    location /uploads/ { proxy_pass http://127.0.0.1:5000; include /etc/nginx/proxy_params; expires 30d; }

    # --- Everything else: Next.js ---
    location / { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
}
# After this works, run:  sudo certbot --nginx -d allsaints.unikcorp.org
